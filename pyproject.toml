[project]
name = "py2exe"
version = "0.2.0"
description = "PyInstaller + Inno Setup + Cloudflare R2 배포 자동화 GUI 와 버전 관리 API 서버"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "packaging>=23.0",
    "pydantic>=2.5",
    "pyside6>=6.6",
    "requests>=2.31",
    "uvicorn>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
